events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Настройки логирования запросов Nginx
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name localhost;

        # Проксирование API запросов, авторизации и видеотрансляции
        location /api/ {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;

            # КРИТИЧЕСКИ ВАЖНО ДЛЯ MJPEG: отключаем буферизацию и кэш Nginx,
            # чтобы видео шло в реальном времени без задержек и накопления в ОЗУ
            proxy_buffering off;
            proxy_cache off;

            # === ДОБАВЛЕННОЕ ИСПРАВЛЕНИЕ: Защита от обрыва стрима ===
            # Увеличиваем время ожидания до 24 часов, чтобы Nginx не рвал бесконечный видеопоток
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Передаем реальный внешний IP-адрес клиента за роутером Keenetic внутрь Go приложения
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        # Раздача встроенного статичного UI фронтенда (вкомпилирован через go embed)
        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
