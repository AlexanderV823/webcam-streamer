<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanek Webcam Streamer</title>
    <!-- Подключаем внешний CSS файл, который Go будет раздавать из embed FS -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <h2>Sanek Webcam Streamer</h2>

        <!-- Форма авторизации -->
        <div id="loginForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" value="admin">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="">
            </div>
            <button onclick="login()">Войти</button>
        </div>

        <!-- Панель управления и плеер -->
        <div id="streamWrapper">
            <div class="controls">
                <label for="cameraSelect">Активный источник:</label>
                <select id="cameraSelect" onchange="switchCamera(this.value)"></select>
            </div>

            <div class="video-container">
                <!-- Встроенный бейдж для одновременного вывода FPS и Сетевого битрейта -->
                <div class="fps-badge">
                    <span class="fps-dot"></span>
                    FPS: <span id="fpsCount">0.0</span> |
                    <span id="bitrateCount">Битрейт: 0.0 Кб/с</span>
                </div>
                <img id="streamView" src="" alt="Видеопоток MJPEG">
            </div>
        </div>

        <div id="error" class="error-msg"></div>
    </div>

    <script>
        let token = "";
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let fpsIntervalId = null;

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const errDiv = document.getElementById('error');
            errDiv.innerText = '';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await res.json();

                if (res.status === 200) {
                    token = data.token;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('streamWrapper').style.display = 'block';

                    await loadCameras();
                    startStream();
                    initStatsMonitor(); // Запуск единого монитора статистики
                } else {
                    errDiv.innerText = data.error || 'Ошибка авторизации';
                }
            } catch (e) {
                errDiv.innerText = 'Не удалось связаться с сервером';
            }
        }

        async function loadCameras() {
            const errDiv = document.getElementById('error');
            try {
                const res = await fetch('/api/cameras', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 200) {
                    const cameras = await res.json();
                    const select = document.getElementById('cameraSelect');
                    select.innerHTML = '';

                    if (cameras && cameras.length > 0) {
                        cameras.forEach(cam => {
                            const opt = document.createElement('option');
                            opt.value = cam.id;
                            opt.textContent = cam.name;
                            select.appendChild(opt);
                        });
                    } else {
                        const opt = document.createElement('option');
                        opt.textContent = "Камеры не найдены";
                        select.appendChild(opt);
                    }
                }
            } catch (e) {
                errDiv.innerText = 'Не удалось загрузить список камер';
            }
        }

        async function switchCamera(cameraId) {
            const errDiv = document.getElementById('error');
            errDiv.innerText = '';

            try {
                const res = await fetch('/api/cameras/switch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ camera_id: cameraId })
                });

                const data = await res.json();

                if (res.status === 200) {
                    startStream();
                } else {
                    errDiv.innerText = data.error || 'Не удалось переключить камеру';
                }
            } catch (e) {
                errDiv.innerText = 'Ошибка сети при переключении камеры';
            }
        }

        function startStream() {
            const img = document.getElementById('streamView');
            img.src = `/api/stream?token=${token}&_cb=${Date.now()}`;
            frameCount = 0;
            lastFrameTime = performance.now();
        }

        // Стабильный монитор ресурсов через Performance API браузера
        function initStatsMonitor() {
            const img = document.getElementById('streamView');
            const fpsCount = document.getElementById('fpsCount');
            const bitrateCount = document.getElementById('bitrateCount');

            // Инкрементируем счетчик FPS на каждый нативно отрисованный кадр
            img.addEventListener('load', () => {
                frameCount++;
            });

            if (fpsIntervalId) clearInterval(fpsIntervalId);

            fpsIntervalId = setInterval(() => {
                const now = performance.now();
                const duration = (now - lastFrameTime) / 1000;

                if (duration > 0) {
                    // 1. Вычисляем точный текущий FPS
                    const currentFPS = (frameCount / duration).toFixed(1);
                    fpsCount.innerText = currentFPS;

                    // 2. Вычисляем битрейт через Performance API
                    // Ищем сетевую метрику загрузки нашего текущего URL стрима
                    let byteCount = 0;
                    const entries = performance.getEntriesByName(img.src);
                    if (entries.length > 0) {
                        const lastEntry = entries[entries.length - 1];
                        // Берем фактический размер переданного закодированного тела ответа
                        byteCount = lastEntry.transferSize || lastEntry.encodedBodySize || 0;
                    }

                    // Переводим байты в Килобайты за секунду
                    const kbs = ((byteCount / 1024) / duration).toFixed(1);

                    // Если поток идет, выводим реальную скорость, если прерван — выводим 0
                    if (frameCount > 0 && kbs > 0) {
                        bitrateCount.innerText = `Битрейт: ${kbs} Кб/с`;
                    } else if (frameCount > 0) {
                        // Фоллбек-расчет, если браузер скрыл transferSize (приблизительный вес кадра ~45 КБ)
                        const fallbackKbs = ((frameCount * 45 * 1024 / 1024) / duration).toFixed(1);
                        bitrateCount.innerText = `Битрейт: ${fallbackKbs} Кб/с`;
                    } else {
                        bitrateCount.innerText = `Битрейт: 0.0 Кб/с`;
                    }
                }

                frameCount = 0;
                lastFrameTime = now;

                // Очищаем старые записи Performance логов в браузере, чтобы исключить утечки памяти
                performance.clearResourceTimings();
            }, 1000);
        }
    </script>
</body>

</html>
