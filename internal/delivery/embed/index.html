<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanek Webcam Streamer</title>
    <!-- Подключаем внешний CSS файл, который Go будет раздавать из embed FS -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <h2>Sanek Webcam Streamer</h2>

        <!-- Форма авторизации -->
        <div id="loginForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" value="admin">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="">
            </div>
            <button onclick="login()">Войти</button>
        </div>

        <!-- Панель управления и плеер -->
        <div id="streamWrapper">
            <div class="controls">
                <label for="cameraSelect">Активный источник:</label>
                <select id="cameraSelect" onchange="switchCamera(this.value)"></select>
            </div>

            <div class="video-container">
                <!-- Панель бейджей расширена под вывод битрейта -->
                <div class="fps-badge">
                    <span class="fps-dot"></span>
                    FPS: <span id="fpsCount">0.0</span> |
                    <span id="bitrateCount">Битрейт: 0.0 Кб/с</span>
                </div>
                <img id="streamView" src="" alt="Видеопоток MJPEG">
            </div>
        </div>

        <div id="error" class="error-msg"></div>
    </div>

    <script>
        let token = "";
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let byteCount = 0; // Глобальный счетчик байт для замера битрейта
        let fpsIntervalId = null;
        let streamAbortController = null; // Контроллер для прерывания fetch при смене камер

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const errDiv = document.getElementById('error');
            errDiv.innerText = '';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await res.json();

                if (res.status === 200) {
                    token = data.token;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('streamWrapper').style.display = 'block';

                    await loadCameras();
                    startStream();
                    initStatsMonitor(); // Запуск единого монитора статистики
                } else {
                    errDiv.innerText = data.error || 'Ошибка авторизации';
                }
            } catch (e) {
                errDiv.innerText = 'Не удалось связаться с сервером';
            }
        }

        async function loadCameras() {
            const errDiv = document.getElementById('error');
            try {
                const res = await fetch('/api/cameras', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 200) {
                    const cameras = await res.json();
                    const select = document.getElementById('cameraSelect');
                    select.innerHTML = '';

                    if (cameras && cameras.length > 0) {
                        cameras.forEach(cam => {
                            const opt = document.createElement('option');
                            opt.value = cam.id;
                            opt.textContent = cam.name;
                            select.appendChild(opt);
                        });
                    } else {
                        const opt = document.createElement('option');
                        opt.textContent = "Камеры не найдены";
                        select.appendChild(opt);
                    }
                }
            } catch (e) {
                errDiv.innerText = 'Не удалось загрузить список камер';
            }
        }

        async function switchCamera(cameraId) {
            const errDiv = document.getElementById('error');
            errDiv.innerText = '';

            try {
                const res = await fetch('/api/cameras/switch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ camera_id: cameraId })
                });

                const data = await res.json();

                if (res.status === 200) {
                    startStream();
                } else {
                    errDiv.innerText = data.error || 'Не удалось переключить камеру';
                }
            } catch (e) {
                errDiv.innerText = 'Ошибка сети при переключении камеры';
            }
        }

        // Функция осуществляет потоковое чтение чанков MJPEG и нарезку JPEG кадров в памяти
        async function startStream() {
            // Если была активна старая трансляция, принудительно обрываем её сетевое подключение
            if (streamAbortController) {
                streamAbortController.abort();
            }
            streamAbortController = new AbortController();

            const img = document.getElementById('streamView');
            frameCount = 0;
            byteCount = 0;
            lastFrameTime = performance.now();

            const streamUrl = `/api/stream?token=${token}&_cb=${Date.now()}`;

            try {
                const response = await fetch(streamUrl, { signal: streamAbortController.signal });
                const reader = response.body.getReader();
                let buffer = new Uint8Array(0);

                                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    byteCount += value.length;

                    // Защита от переполнения: если буфер разросся до 2 МБ без валидных кадров,
                    // значит там накопился сетевой мусор во время переключения камер. Сбрасываем его.
                    if (buffer.length > 2 * 1024 * 1024) {
                        console.warn("[STREAM] Буфер переполнен мусором, принудительная очистка памяти.");
                        buffer = new Uint8Array(0);
                    }

                    const tmp = new Uint8Array(buffer.length + value.length);
                    tmp.set(buffer);
                    tmp.set(value, buffer.length);
                    buffer = tmp;

                    let startIdx = -1;
                    for (let i = 0; i < buffer.length - 1; i++) {
                        if (buffer[i] === 0xFF && buffer[i + 1] === 0xD8) {
                            startIdx = i;
                            break;
                        }
                    }

                    if (startIdx !== -1) {
                        let endIdx = -1;
                        for (let i = startIdx; i < buffer.length - 1; i++) {
                            if (buffer[i] === 0xFF && buffer[i + 1] === 0xD9) {
                                endIdx = i + 2;
                                break;
                            }
                        }

                        if (endIdx !== -1) {
                            const rawJpeg = buffer.subarray(startIdx, endIdx);
                            const blob = new Blob([rawJpeg], { type: 'image/jpeg' });

                            const oldUrl = img.src;
                            img.src = URL.createObjectURL(blob);

                            if (oldUrl && oldUrl.startsWith('blob:')) {
                                URL.revokeObjectURL(oldUrl);
                            }

                            frameCount++;
                            buffer = buffer.subarray(endIdx);
                        }
                    }
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    console.error('Ошибка MJPEG стримера:', e);
                }
            }
        }

        // Единый таймер мониторинга сетевых ресурсов и гладкости кадров
        function initStatsMonitor() {
            const fpsCount = document.getElementById('fpsCount');
            const bitrateCount = document.getElementById('bitrateCount');

            if (fpsIntervalId) clearInterval(fpsIntervalId);

            fpsIntervalId = setInterval(() => {
                const now = performance.now();
                const duration = (now - lastFrameTime) / 1000;

                if (duration > 0) {
                    // Вычисляем текущий FPS
                    const currentFPS = (frameCount / duration).toFixed(1);
                    fpsCount.innerText = currentFPS;

                    // Вычисляем битрейт: байты переводим в Килобайты за секунду
                    const kbs = ((byteCount / 1024) / duration).toFixed(1);
                    bitrateCount.innerText = `Битрейт: ${kbs} Кб/с`;
                }

                frameCount = 0;
                byteCount = 0;
                lastFrameTime = now;
            }, 1000);
        }
    </script>
</body>

</html>
